[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && (npx prisma migrate deploy || echo 'Migration skipped - DATABASE_URL not configured') && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
