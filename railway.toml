[build]
builder = "nixpacks"

[build.nixpacks]
buildCmd = "cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build && cd ../frontend && npm install && npm run build"

[deploy]
startCommand = "cd backend && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[services]]
name = "web"
